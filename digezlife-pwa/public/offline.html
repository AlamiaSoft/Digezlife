<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline — AlamiaLife</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0d0a3a;
        color: white;
        text-align: center;
      }
      .wrap { padding: 2rem; max-width: 22rem; }
      .mark {
        width: 4rem; height: 4rem; margin: 0 auto 1.25rem;
        border-radius: 20px; background: #6163f2;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.75rem;
      }
      h1 { font-size: 1.15rem; margin: 0 0 0.5rem; }
      p { margin: 0; opacity: 0.7; font-size: 0.9rem; }
      button {
        margin-top: 1.5rem; padding: 0.6rem 1.25rem; border-radius: 999px;
        border: none; background: white; color: #3933a7; font-weight: 600;
        font-size: 0.875rem; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">&#9889;</div>
      <h1>You're offline</h1>
      <p>AlamiaLife couldn't reach the network and nothing was saved for this page yet. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
