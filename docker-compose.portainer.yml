version: '3.8'

# DigEzLife Portainer Stack Configuration
# Hostnames:
# - Consumer PWA: https://digeezlife.alamiaconnect.com
# - API & SuperAdmin: https://digeezsalife.alamiaconnect.com

networks:
  digezlife-net:
    driver: bridge

volumes:
  digezlife-storage:
  digezlife-db:
  digezlife-redis-data:

services:
  # -------------------------------------------------------------
  # 1. Consumer PWA Client (Static Nginx PWA)
  # Cloudflare Tunnel Ingress: digeezlife.alamiaconnect.com -> http://digezlife-pwa:80
  # -------------------------------------------------------------
  digezlife-pwa:
    build:
      context: ./digezlife-pwa
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://digeezsalife.alamiaconnect.com
    image: digezlife-pwa:latest
    container_name: digezlife-pwa
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - digezlife-net

  # -------------------------------------------------------------
  # 2. SaaS API & SuperAdmin Backend (FrankenPHP Octane)
  # Cloudflare Tunnel Ingress: digeezsalife.alamiaconnect.com -> http://digezlife-backend:8000
  # -------------------------------------------------------------
  digezlife-backend:
    build:
      context: ./digezlife-backend
      dockerfile: Dockerfile
    image: digezlife-backend:latest
    container_name: digezlife-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: DigEzLife
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://digeezsalife.alamiaconnect.com
      CORS_ALLOWED_ORIGINS: "https://digeezlife.alamiaconnect.com,http://localhost:3000"
      SANCTUM_STATEFUL_DOMAINS: "digeezlife.alamiaconnect.com,digeezsalife.alamiaconnect.com"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: digezlife-redis
      REDIS_PORT: 6379
    volumes:
      - digezlife-storage:/app/storage
      - digezlife-db:/app/database
    depends_on:
      - digezlife-redis
    networks:
      - digezlife-net

  # -------------------------------------------------------------
  # 3. Redis Service (Cache, Rate Limits, Queue Broker)
  # -------------------------------------------------------------
  digezlife-redis:
    image: redis:7-alpine
    container_name: digezlife-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - digezlife-redis-data:/data
    networks:
      - digezlife-net

  # -------------------------------------------------------------
  # 4. Background Queue Worker (Async Jobs, Notifications)
  # -------------------------------------------------------------
  digezlife-worker:
    image: digezlife-backend:latest
    container_name: digezlife-worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      QUEUE_CONNECTION: redis
      REDIS_HOST: digezlife-redis
      REDIS_PORT: 6379
    volumes:
      - digezlife-storage:/app/storage
      - digezlife-db:/app/database
    depends_on:
      - digezlife-backend
      - digezlife-redis
    networks:
      - digezlife-net

  # -------------------------------------------------------------
  # 5. Scheduled Tasks & Reminders Cron
  # -------------------------------------------------------------
  digezlife-scheduler:
    image: digezlife-backend:latest
    container_name: digezlife-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      REDIS_HOST: digezlife-redis
      REDIS_PORT: 6379
    volumes:
      - digezlife-storage:/app/storage
      - digezlife-db:/app/database
    depends_on:
      - digezlife-backend
      - digezlife-redis
    networks:
      - digezlife-net
