version: '3.8'

# GharlyApp Portainer Stack Configuration
# Hostnames:
# - Consumer PWA: https://gharly.alamiaconnect.com (Option B: Self-hosted VPS or Option A: CF Pages)
# - API & SuperAdmin: https://gharlapi.alamiaconnect.com

networks:
  gharly-net:
    driver: bridge

volumes:
  gharly-storage:
  gharly-db:
  gharly-redis-data:

services:
  # -------------------------------------------------------------
  # 1. Consumer PWA Client (Static Nginx PWA)
  # (Optional on VPS if using Cloudflare Pages for Frontend)
  # Cloudflare Tunnel Ingress: gharly.alamiaconnect.com -> http://gharly-pwa:80
  # -------------------------------------------------------------
  gharly-pwa:
    build:
      context: ./digezlife-pwa
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://gharlapi.alamiaconnect.com
    image: gharly-pwa:latest
    container_name: gharly-pwa
    restart: unless-stopped
    ports:
      - "${PWA_PORT:-3082}:80"
    networks:
      - gharly-net

  # -------------------------------------------------------------
  # 2. SaaS API & SuperAdmin Backend (FrankenPHP Octane)
  # Cloudflare Tunnel Ingress: gharlapi.alamiaconnect.com -> http://localhost:8082 (or http://gharly-backend:8000)
  # -------------------------------------------------------------
  gharly-backend:
    build:
      context: ./digezlife-backend
      dockerfile: Dockerfile
    image: gharly-backend:latest
    container_name: gharly-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8082}:8000"
    environment:
      APP_NAME: GharlyApp
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://gharlapi.alamiaconnect.com
      CORS_ALLOWED_ORIGINS: "https://gharly.alamiaconnect.com,https://gharlyapp.com,https://gharlyapp.pages.dev,http://localhost:3000"
      SANCTUM_STATEFUL_DOMAINS: "gharly.alamiaconnect.com,gharlapi.alamiaconnect.com,gharlyapp.com,gharlyapp.pages.dev"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SUPERADMIN_NAME: "System Admin"
      SUPERADMIN_EMAIL: "admin@gharlyapp.com"
      SUPERADMIN_PASSWORD: "Admin@Gharly2026!"
      REDIS_HOST: gharly-redis
      REDIS_PORT: 6379
    volumes:
      - gharly-storage:/app/storage
      - gharly-db:/app/database
    depends_on:
      - gharly-redis
    networks:
      - gharly-net

  # -------------------------------------------------------------
  # 3. Redis Service (Cache, Rate Limits, Queue Broker)
  # -------------------------------------------------------------
  gharly-redis:
    image: redis:7-alpine
    container_name: gharly-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gharly-redis-data:/data
    networks:
      - gharly-net

  # -------------------------------------------------------------
  # 4. Background Queue Worker (Async Jobs, Notifications)
  # -------------------------------------------------------------
  gharly-worker:
    image: gharly-backend:latest
    container_name: gharly-worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep 'queue:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      QUEUE_CONNECTION: redis
      REDIS_HOST: gharly-redis
      REDIS_PORT: 6379
    volumes:
      - gharly-storage:/app/storage
      - gharly-db:/app/database
    depends_on:
      - gharly-backend
      - gharly-redis
    networks:
      - gharly-net

  # -------------------------------------------------------------
  # 5. Scheduled Tasks & Reminders Cron
  # -------------------------------------------------------------
  gharly-scheduler:
    image: gharly-backend:latest
    container_name: gharly-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep 'schedule:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      REDIS_HOST: gharly-redis
      REDIS_PORT: 6379
    volumes:
      - gharly-storage:/app/storage
      - gharly-db:/app/database
    depends_on:
      - gharly-backend
      - gharly-redis
    networks:
      - gharly-net
