<button class="key-btn h-12 rounded-lg bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high active:scale-95 flex items-center justify-center font-headline-md text-headline-md text-on-surface font-semibold transition-all" data-val="6" type="button">6</button>
<button class="key-btn h-12 rounded-lg bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high active:scale-95 flex items-center justify-center font-headline-md text-headline-md text-on-surface font-semibold transition-all" data-val="7" type="button">7</button>
<button class="key-btn h-12 rounded-lg bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high active:scale-95 flex items-center justify-center font-headline-md text-headline-md text-on-surface font-semibold transition-all" data-val="8" type="button">8</button>
<button class="key-btn h-12 rounded-lg bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high active:scale-95 flex items-center justify-center font-headline-md text-headline-md text-on-surface font-semibold transition-all" data-val="9" type="button">9</button>
<button class="key-btn h-12 rounded-lg bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high active:scale-95 flex items-center justify-center font-headline-md text-headline-md text-on-surface font-bold transition-all" data-val="." type="button">.</button>
<button class="key-btn h-12 rounded-lg bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high active:scale-95 flex items-center justify-center font-headline-md text-headline-md text-on-surface font-semibold transition-all" data-val="0" type="button">0</button>
<button class="key-btn h-12 rounded-lg bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high active:scale-95 flex items-center justify-center text-on-surface transition-all text-secondary" data-action="backspace" type="button">
<span class="material-symbols-outlined text-[24px]">backspace</span>
</button>
</div>
</div>
</div>
<!-- Primary Floating Action Bar -->
<div class="px-gutter pt-space-xs pb-space-lg">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary py-3.5 px-4 rounded-xl shadow-md font-title-md text-title-md flex items-center justify-center gap-2 active:scale-[0.98] transition-all" id="save-kharcha-btn" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span id="save-btn-label">Kharcha Save Karein (PKR 1,850)</span>
</button>
</div>
<!-- Success Toast / Micro feedback banner -->
<div class="fixed bottom-6 left-4 right-4 bg-primary text-on-primary p-3 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-32 transition-transform duration-300 z-50 pointer-events-none" id="save-toast">
<span class="material-symbols-outlined text-tertiary-fixed text-[24px]">verified</span>
<div class="flex flex-col">
<span class="font-title-md text-title-md">Zabardast! Kharcha Darj Ho Gaya</span>
<span class="font-body-sm text-body-sm text-on-primary/80">Rs. 1,850 Sauda-Salf ledger me shamil kar diya gaya hai.</span>
</div>
</div>
</div>
<script>
  (function initAddKharcha() {
    let rawAmount = "1850";
    const amountValEl = document.getElementById("amount-val");
    const saveBtnLabel = document.getElementById("save-btn-label");
    const keypad = document.querySelectorAll(".key-btn");
    const presets = document.querySelectorAll(".preset-btn");
    const typeButtons = document.querySelectorAll(".type-btn");
    const categoryChips = document.querySelectorAll(".category-chip");
    const walletChips = document.querySelectorAll(".wallet-chip");
    const receiptBtn = document.getElementById("receipt-btn");
    const receiptPreview = document.getElementById("receipt-preview");
    const removeReceipt = document.getElementById("remove-receipt");
    const toggleShared = document.getElementById("toggle-shared");
    const saveBtn = document.getElementById("save-kharcha-btn");
    const toast = document.getElementById("save-toast");
    const voicePill = document.getElementById("voice-memo-pill");
    const descInput = document.getElementById("desc-input");

    let currentType = "Kharcha";

    function formatNumberWithCommas(val) {
      if (!val || val === "0") return "0";
      const parts = val.split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }

    function updateDisplay() {
      const formatted = formatNumberWithCommas(rawAmount);
      amountValEl.textContent = formatted || "0";
      saveBtnLabel.textContent = currentType === "Kharcha" 
        ? `Kharcha Save Karein (PKR ${formatted || "0"})`
        : currentType === "Aamdani"
        ? `Aamdani Record Karein (PKR ${formatted || "0"})`
        : `Transfer Save Karein (PKR ${formatted || "0"})`;
    }

    // Keypad entry
    keypad.forEach(button => {
      button.addEventListener("click", () => {
        const val = button.dataset.val;
        const action = button.dataset.action;

        if (action === "backspace") {
          rawAmount = rawAmount.slice(0, -1);
          if (rawAmount === "") rawAmount = "0";
        } else if (val) {
          if (val === ".") {
            if (!rawAmount.includes(".")) {
              rawAmount = (rawAmount === "" ? "0" : rawAmount) + ".";
            }
          } else {
            if (rawAmount === "0") {
              rawAmount = val;
            } else if (rawAmount.length < 9) {
              rawAmount += val;
            }
          }
        }
        updateDisplay();
      });
    });

    // Preset increments
    presets.forEach(preset => {
      preset.addEventListener("click", () => {
        const addVal = parseInt(preset.dataset.add, 10);
        let curr = parseFloat(rawAmount) || 0;
        curr += addVal;
        rawAmount = Math.round(curr).toString();
        updateDisplay();
      });
    });

    // Type toggles
    typeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        typeButtons.forEach(b => {
          b.className = "type-btn flex-1 py-2 rounded-full font-label-md text-label-md transition-all text-center text-on-surface-variant hover:text-on-surface";
        });
        btn.className = "type-btn flex-1 py-2 rounded-full font-label-md text-label-md transition-all text-center bg-primary text-on-primary shadow-sm";
        currentType = btn.dataset.type;
        updateDisplay();
      });
    });

    // Category selection highlight
    categoryChips.forEach(chip => {
      chip.addEventListener("click", () => {
        categoryChips.forEach(c => {
          c.className = "category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-surface-container-lowest text-on-surface hover:bg-surface-container-low font-label-md text-label-md transition-all active:scale-95";
          const checkIcon = c.querySelector(".material-symbols-outlined");
          if (checkIcon && checkIcon.textContent === "check_circle") checkIcon.remove();
        });
        chip.className = "category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-primary text-on-primary shadow-sm font-label-md text-label-md transition-all active:scale-95";
        
        if (!chip.querySelector(".material-symbols-outlined")) {
          const tick = document.createElement("span");
          tick.className = "material-symbols-outlined text-[16px] text-secondary-container";
          tick.style.fontVariationSettings = "'FILL' 1";
          tick.textContent = "check_circle";
          chip.appendChild(tick);
        }
      });
    });

    // Wallet selection highlight
    walletChips.forEach(wChip => {
      wChip.addEventListener("click", () => {
        walletChips.forEach(w => {
          w.className = "wallet-chip flex-shrink-0 flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-container-lowest hover:bg-surface-container-low font-label-md text-label-md text-on-surface transition-all active:scale-95";
          const check = w.querySelector(".material-symbols-outlined");
          if (check && check.textContent === "check_circle") check.remove();
        });
        wChip.className = "wallet-chip flex-shrink-0 flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-container-lowest shadow-sm font-label-md text-label-md text-on-surface transition-all active:scale-95";
        const tick = document.createElement("span");
        tick.className = "material-symbols-outlined text-primary text-[18px] ml-1";
        tick.style.fontVariationSettings = "'FILL' 1";
        tick.textContent = "check_circle";
        wChip.appendChild(tick);
      });
    });

    // Receipt toggle
    receiptBtn.addEventListener("click", () => {
      receiptPreview.classList.toggle("hidden");
    });

    removeReceipt.addEventListener("click", () => {
      receiptPreview.classList.add("hidden");
    });

    // Shared household toggle
    let isShared = true;
    toggleShared.addEventListener("click", () => {
      isShared = !isShared;
      if (isShared) {
        toggleShared.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-primary-fixed text-on-primary-fixed font-label-md text-label-md transition-all";
        toggleShared.innerHTML = '<span class="material-symbols-outlined text-[16px]">diversity_3</span><span>Shared Household</span>';
      } else {
        toggleShared.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-md text-label-md transition-all";
        toggleShared.innerHTML = '<span class="material-symbols-outlined text-[16px]">person</span><span>Zati (Personal)</span>';
      }
    });

    // Urdu Voice recording simulated trigger
    voicePill.addEventListener("click", () => {
      descInput.value = "Al-Madina Bakery - 2 Doodh & Rusk";
      rawAmount = "380";
      updateDisplay();
      voicePill.innerHTML = '<span class="material-symbols-outlined text-[16px] animate-pulse">check</span><span>Pehchaan Liya!</span>';
      setTimeout(() => {
        voicePill.innerHTML = '<span class="material-symbols-outlined text-[16px]">mic</span><span>Bol Kar Likhein</span>';
      }, 2500);
    });

    // Save kharcha feedback
    saveBtn.addEventListener("click", () => {
      toast.classList.remove("translate-y-32");
      toast.classList.add("translate-y-0");
      setTimeout(() => {
        toast.classList.add("translate-y-32");
        toast.classList.remove("translate-y-0");
      }, 3000);
    });

    updateDisplay();
  })();
</script></main></body></html>
